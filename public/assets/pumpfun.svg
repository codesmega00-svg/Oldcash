<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="pumpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="10" fill="#0b1712" stroke="#10b981" stroke-width="2"/>
  <!-- Pill shape -->
  <g transform="rotate(-35 24 24)">
    <rect x="14" y="10" width="20" height="14" rx="10" fill="url(#pillGrad)"/>
    <rect x="14" y="24" width="20" height="14" rx="10" fill="#ffffff"/>
    <line x1="14" y1="24" x2="34" y2="24" stroke="#059669" stroke-width="1.5"/>
  </g>
  <!-- Sparkles -->
  <circle cx="10" cy="12" r="1.5" fill="#34d399"/>
  <circle cx="39" cy="36" r="2" fill="#34d399"/>
</svg>
